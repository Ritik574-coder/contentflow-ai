<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bg)" rx="12"/>

  <!-- Top Bar / Header Mockup -->
  <rect x="30" y="30" width="940" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <circle cx="55" cy="55" r="6" fill="#ef4444"/>
  <circle cx="75" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="6" fill="#10b981"/>
  <text x="500" y="60" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ContentFlow AI — Live Dashboard (GitHub Pages + Cloudflare Worker API)</text>

  <!-- Metric Summary Cards Row -->
  <g transform="translate(30, 95)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="85" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOTAL CONTENT</text>
    <text x="15" y="58" fill="#6366f1" font-family="sans-serif" font-size="28" font-weight="800">24</text>
    <text x="180" y="30" fill="#6366f1" font-family="sans-serif" font-size="20">📄</text>

    <!-- Card 2 -->
    <rect x="240" y="0" width="220" height="85" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="255" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PENDING APPROVALS</text>
    <text x="255" y="58" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="800">3</text>
    <text x="420" y="30" fill="#f59e0b" font-family="sans-serif" font-size="20">⏳</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="220" height="85" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="495" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PUBLISHED POSTS</text>
    <text x="495" y="58" fill="#10b981" font-family="sans-serif" font-size="28" font-weight="800">18</text>
    <text x="660" y="30" fill="#10b981" font-family="sans-serif" font-size="20">🚀</text>

    <!-- Card 4 -->
    <rect x="720" y="0" width="220" height="85" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="735" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOTAL ENGAGEMENT</text>
    <text x="735" y="58" fill="#ec4899" font-family="sans-serif" font-size="28" font-weight="800">1,420</text>
    <text x="900" y="30" fill="#ec4899" font-family="sans-serif" font-size="20">📈</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(30, 200)">
    <!-- Left Panel: Content Pipeline Feed -->
    <rect x="0" y="0" width="580" height="270" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Recent Content Pipeline Activity</text>

    <!-- Item 1 -->
    <rect x="20" y="45" width="540" height="60" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="68" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Building Resilience in Distributed Cloud Networks</text>
    <text x="35" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11">AI Provider: GPT-4o • Platforms: Blogger, LinkedIn, DEV.to</text>
    <rect x="460" y="62" width="85" height="22" rx="11" fill="#065f46"/>
    <text x="502" y="77" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PUBLISHED</text>

    <!-- Item 2 -->
    <rect x="20" y="115" width="540" height="60" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="138" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Understanding Cloudflare Workers and D1 Database</text>
    <text x="35" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">AI Provider: Claude 3.5 • Telegram Poll Sent</text>
    <rect x="460" y="132" width="85" height="22" rx="11" fill="#78350f"/>
    <text x="502" y="147" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PENDING</text>

    <!-- Item 3 -->
    <rect x="20" y="185" width="540" height="60" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="208" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Async Event Architecture with Webhooks &amp; Queue</text>
    <text x="35" y="228" fill="#94a3b8" font-family="sans-serif" font-size="11">AI Provider: Gemini 1.5 • Platforms: DEV.to</text>
    <rect x="460" y="202" width="85" height="22" rx="11" fill="#065f46"/>
    <text x="502" y="217" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PUBLISHED</text>

    <!-- Right Panel: System Health & Engagement Chart -->
    <rect x="600" y="0" width="340" height="270" rx="8" fill="url(#card)" stroke="#334155"/>
    <text x="620" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Metrics Snapshot &amp; Status</text>

    <!-- Simulated Mini Bar Chart -->
    <g transform="translate(620, 50)">
      <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">Platform Engagement Views</text>
      <!-- Bars -->
      <rect x="10" y="30" width="35" height="110" rx="4" fill="#6366f1"/>
      <text x="27" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Blogger</text>

      <rect x="65" y="70" width="35" height="70" rx="4" fill="#a855f7"/>
      <text x="82" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">LinkedIn</text>

      <rect x="120" y="45" width="35" height="95" rx="4" fill="#ec4899"/>
      <text x="137" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">DEV.to</text>

      <rect x="175" y="130" width="35" height="10" rx="4" fill="#475569"/>
      <text x="192" y="155" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Hashnode</text>

      <rect x="230" y="130" width="35" height="10" rx="4" fill="#475569"/>
      <text x="247" y="155" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">X</text>
    </g>

    <line x1="620" y1="220" x2="920" y2="220" stroke="#334155" stroke-width="1"/>
    <text x="620" y="245" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">🟢 Cloudflare D1 &amp; Worker API Operational</text>
  </g>
</svg>
