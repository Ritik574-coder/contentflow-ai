<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative grid lines -->
  <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 300,0 L 300,400 M 600,0 L 600,400 M 900,0 L 900,400" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Title Badge -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="540" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="1">CONTENTFLOW AI</text>
    <text x="540" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Autonomous AI Content Pipeline &amp; Multi-Platform Distribution Architecture</text>
  </g>

  <!-- Node 1: Ingestion -->
  <g transform="translate(60, 150)">
    <rect width="220" height="180" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="18" fill="#6366f1" opacity="0.2"/>
    <text x="40" y="45" fill="#818cf8" font-family="sans-serif" font-size="18" text-anchor="middle">📝</text>
    <text x="70" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Raw Input</text>
    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12">• Issue / Note Markdown</text>
    <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">• Process Trigger (Actions)</text>
    <text x="20" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12">• Schema Validation</text>
    <rect x="20" y="150" width="180" height="18" rx="4" fill="#312e81"/>
    <text x="110" y="163" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">GitHub Actions Trigger</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 240 L 330 240" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Node 2: AI Processing -->
  <g transform="translate(340, 150)">
    <rect width="240" height="180" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="#a855f7" opacity="0.2"/>
    <text x="40" y="45" fill="#c084fc" font-family="sans-serif" font-size="18" text-anchor="middle">🤖</text>
    <text x="70" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">AI Fallback Engine</text>
    <text x="20" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Swappable Model Chain:</text>
    <text x="20" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">1. OpenAI GPT-4o</text>
    <text x="20" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">2. Anthropic Claude 3.5</text>
    <text x="20" y="136" fill="#94a3b8" font-family="sans-serif" font-size="11">3. Google Gemini 1.5</text>
    <text x="20" y="154" fill="#94a3b8" font-family="sans-serif" font-size="11">4. Manual Deterministic Fallback</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 580 240 L 630 240" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Node 3: Telegram Approval -->
  <g transform="translate(640, 150)">
    <rect width="220" height="180" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="#ec4899" opacity="0.2"/>
    <text x="40" y="45" fill="#f472b6" font-family="sans-serif" font-size="18" text-anchor="middle">💬</text>
    <text x="70" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Human Approval</text>
    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12">• Interactive Telegram Bot</text>
    <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">• Per-Platform Toggles</text>
    <text x="20" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12">• Cloudflare Worker Webhook</text>
    <rect x="20" y="150" width="180" height="18" rx="4" fill="#831843"/>
    <text x="110" y="163" fill="#fbcfe8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Explicit Human Gate</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 860 240 L 910 240" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Node 4: Multi-Platform Publishing -->
  <g transform="translate(920, 150)">
    <rect width="220" height="180" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="#10b981" opacity="0.2"/>
    <text x="40" y="45" fill="#34d399" font-family="sans-serif" font-size="18" text-anchor="middle">🚀</text>
    <text x="70" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Distribution</text>
    <text x="20" y="85" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">✓ Blogger</text>
    <text x="20" y="105" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">✓ LinkedIn</text>
    <text x="20" y="125" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">✓ DEV.to</text>
    <text x="20" y="145" fill="#64748b" font-family="sans-serif" font-size="11">✕ Hashnode / X (Disabled)</text>
    <rect x="20" y="152" width="180" height="18" rx="4" fill="#064e3b"/>
    <text x="110" y="165" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Idempotent API Dispatch</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
</svg>
