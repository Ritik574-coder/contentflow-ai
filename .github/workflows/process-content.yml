name: Process Content

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: Existing content ID to re-process
        required: false
        type: string
      raw_text:
        description: Raw note text to ingest and process
        required: false
        type: string
  repository_dispatch:
    types: [content-submitted]

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Run processing pipeline
        env:
          RAW_TEXT: ${{ github.event.inputs.raw_text || github.event.client_payload.raw_text }}
          CONTENT_ID: ${{ github.event.inputs.content_id || github.event.client_payload.content_id }}
          AI_PROVIDER_ORDER: gemini,groq,workers_ai
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/process.js
